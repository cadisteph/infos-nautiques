<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infos Nautiques</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .carte {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #334155;
        }
        .carte-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .carte-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100px;
        }
        .data-ligne {
            font-size: 1rem;
        }
        .non-dispo {
            color: #94a3b8;
            font-style: italic;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <h1 id="nomVille">📍 Le Havre</h1>
        </div>

        <div class="carte" id="carteMaree">
            <h2 class="carte-title">🌊 MARÉE</h2>
            <div class="carte-body">
                <p style="color: rgba(255,255,255,0.5);">Chargement des données SHOM...</p>
            </div>
        </div>

    </div>

    <script src="js/marees.js?v=11"></script>
    
    <script>
        // Simulation du déclenchement initial une fois la page chargée
        window.addEventListener('DOMContentLoaded', () => {
            const carte = document.getElementById('carteMaree');
            // Appel de la fonction présente dans js/marees.js
            // Paramètres : (élément conteneur, données anciennes ou null, estLittoral = true)
            if (typeof calculerEtAfficherMarees === 'function') {
                calculerEtAfficherMarees(carte, null, true);
            } else {
                console.error("La fonction calculerEtAfficherMarees n'a pas pu être chargée depuis js/marees.js");
            }
        });
    </script>
</body>
</html>
